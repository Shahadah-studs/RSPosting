<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedStonePosting | Create & Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon1.png?v=6">
    <link rel="manifest" href="manifest.json">

    <link href="https://cdnfonts.com" rel="stylesheet">
</head>
<body>

    <header class="mc-header">
        <h1 class="mc-title" id="goHome" style="cursor:pointer;">RedStonePosting</h1>
        <div id="authStatus" class="user-status"></div>
    </header>

    <main class="mc-container">
        <!-- Authentication Screen -->
        <section id="authView" class="mc-panel hide">
            <h2 id="authTitle">Log in to Hub</h2>
            <div class="mc-form-group">
                <label>Username:</label>
                <input type="text" id="authUsername" class="mc-input" placeholder="Pick your player name...">
            </div>
            <div class="mc-form-group">
                <label>Password:</label>
                <input type="password" id="authPassword" class="mc-input" placeholder="Enter password...">
            </div>
            <div style="margin-top: 15px;">
                <button id="authPrimaryBtn" class="mc-btn">Log In</button>
                <button id="authToggleBtn" class="mc-btn-text">Create an account</button>
            </div>
        </section>

        <!-- Main Hub Feed View -->
        <div id="hubView" class="hide">
            <section class="mc-panel new-post-box">
                <h2>PLACE YOUR POST TEXT HERE</h2>
                <textarea id="postContent" placeholder="(e.g. I built a castle in minecraft/bloxd)"></textarea>
                

                <button id="submitPostBtn" class="mc-btn">POST BLOCK</button>
            </section>
            <section id="feedContainer" class="feed-container"></section>
        </div>

        <!-- Public Player Profile View -->
        <div id="profileView" class="hide">
            <section class="mc-panel profile-box">
                <div class="profile-header-card">
                    <div id="profilePfp" class="avatar-big"></div>
                    <div>
                        <h2 id="profileUsername" style="margin:0;"></h2>
                        <p id="profileJoined" class="post-meta" style="margin:5px 0 0 0;">Active Redstone Network Player and user</p>
                    </div>
                </div>
                <button id="backToFeedBtn" class="mc-btn" style="margin-top:15px;">Back to Hub</button>
            </section>
            <h3 style="text-shadow: 2px 2px #000; margin-bottom:15px;">Creations by this player:</h3>
            <section id="profileFeedContainer" class="feed-container"></section>
        </div>
    </main>



    <div style="position: fixed; bottom: 15px; left: 15px; background-color: #2c2c2c; border: 4px solid #1e1e1e; box-shadow: inset 3px 3px #8f8f8f, inset -3px -3px #111; padding: 8px 12px; font-size: 11px; z-index: 9999; text-shadow: 1px 1px #000; color: #ffaa00;">
         Developed by Shahadah Studios Elite
    </div>
 
<a href="https://visitorbadge.io/status?path=https%3A%2F%2Fredstoneposting.vercel.app%2F" target="_blank" style="position: fixed; bottom: 15px; right: 15px; display: inline-block; z-index: 9999; border: 2px solid #1e1e1e; box-shadow: 2px 2px #000; line-height: 0;">
    <img src="https://api.visitorbadge.io/api/daily?path=https%3A%2F%2Fredstoneposting.vercel.app%2F&label=Visitors%20&labelColor=%2337d67a&countColor=%23dce775&style=plastic" alt="Visitors" style="display: block; height: 26px;">
</a>
 

    <!-- Automatic Team Badge and Swear Filter Engine -->
    <script>
        const badWords = ["fuck", "shit", "ass"];

        function filterText(text) {
            let clean = text;
            badWords.forEach(word => {
                const regex = new RegExp("\\b" + word + "\\b|\\b" + word + "s\\b", "gi");
                clean = clean.replace(regex, "[CENSORED]");
            });
            return clean;
        }

        const layoutObserver = new MutationObserver(() => {
            // 1. Swear Filter Processing on post bodies
            document.querySelectorAll('.post-body').forEach(post => {
                let html = post.innerHTML;
                html = filterText(html);
                if (post.innerHTML !== html) post.innerHTML = html;
            });

            // 2. Team Badges (Crown, Wrench, Medal)
            document.querySelectorAll('.username-link').forEach(link => {
                const nameText = link.innerText.trim().toLowerCase();
                
                // Shahadah_Studios Crown
                if ((nameText === 'shahadah_studios' || nameText === 'shahadah_studios_elite') && !link.querySelector('.owner-crown')) {
                    const crownSpan = document.createElement('span');
                    crownSpan.className = 'owner-crown';
                    crownSpan.innerText = ' 👑';
                    crownSpan.title = 'OWNER & DEVELOPER';
                    crownSpan.style.marginLeft = '4px';
                    crownSpan.style.cursor = 'help';
                    crownSpan.style.display = 'inline-block';
                    link.appendChild(crownSpan);
                }
                
                // superb1oxd_303 Wrench
                if (nameText === 'superb1oxd_303' && !link.querySelector('.dev-wrench')) {
                    const wrenchSpan = document.createElement('span');
                    wrenchSpan.className = 'dev-wrench';
                    wrenchSpan.innerText = ' 🔧';
                    wrenchSpan.title = 'DEVELOPER';
                    wrenchSpan.style.marginLeft = '4px';
                    wrenchSpan.style.cursor = 'help';
                    wrenchSpan.style.display = 'inline-block';
                    link.appendChild(wrenchSpan);
                }
// CoolSuff Aprrv creator
                if (nameText === 'coolsuff' && !link.querySelector('.creator-badge')) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'creator-badge';
                    badgeSpan.innerText = ' 🌟';
                    badgeSpan.title = 'APPROVED CREATOR';
                    badgeSpan.style.marginLeft = '4px';
                    badgeSpan.style.cursor = 'help';
                    badgeSpan.style.display = 'inline-block';
                    link.appendChild(badgeSpan);
                }
                // iamyoubutbetter Early User Medal
                if (nameText === 'iamyoubutbetter' && !link.querySelector('.early-badge')) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'early-badge';
                    badgeSpan.innerText = ' 🥇';
                    badgeSpan.title = 'EARLY USER';
                    badgeSpan.style.marginLeft = '4px';
                    badgeSpan.style.cursor = 'help';
                    badgeSpan.style.display = 'inline-block';
                    link.appendChild(badgeSpan);
                }
                // Mint_Icecream Early User Medal
                if (nameText === 'mint_icecream' && !link.querySelector('.early-badge')) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'early-badge';
                    badgeSpan.innerText = ' 🥇 ⚔';
                    badgeSpan.title = 'EARLY USER & SCOUT';
                    badgeSpan.style.marginLeft = '4px';
                    badgeSpan.style.cursor = 'help';
                    badgeSpan.style.display = 'inline-block';
                    link.appendChild(badgeSpan);
                } 
                 // ZakirKing123 
                if (nameText === 'zakirking123' && !link.querySelector('.early-badge')) {
                    const badgeSpan = document.createElement('span');
                    badgeSpan.className = 'early-badge';
                    badgeSpan.innerText = ' ✅';
                    badgeSpan.title = 'VERIFIED';
                    badgeSpan.style.marginLeft = '4px';
                    badgeSpan.style.cursor = 'help';
                    badgeSpan.style.display = 'inline-block';
                    link.appendChild(badgeSpan);
                }
               
            });
        });
        
        layoutObserver.observe(document.body, { childList: true, subtree: true });
    </script>


    <script src="app.js"></script>
<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('RSP Application Circuit Armed!'))
                    .catch(err => console.log('PWA Load Error:', err));
            });
        }
    </script>
</body>
</html>
