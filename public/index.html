<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstoneposting | Create & Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon1.png?v=6">
    <link href="https://cdnfonts.com" rel="stylesheet">
</head>
<body>

    <header class="mc-header">
        <h1 class="mc-title" id="goHome" style="cursor:pointer;">Redstoneposting</h1>
        <div id="authStatus" class="user-status"></div>
    </header>

    <main class="mc-container">
        <!-- Authentication Screen -->
        <section id="authView" class="mc-panel hide">
            <h2 id="authTitle">Log in to Hub</h2>
            <div class="mc-form-group">
                <label>Username:</label>
                <input type="text" id="authUsername" class="mc-input" placeholder="Pick your player name...">
            </div>
            <div class="mc-form-group">
                <label>Password:</label>
                <input type="password" id="authPassword" class="mc-input" placeholder="Enter password...">
            </div>
            <div style="margin-top: 15px;">
                <button id="authPrimaryBtn" class="mc-btn">Log In</button>
                <button id="authToggleBtn" class="mc-btn-text">Create an account</button>
            </div>
        </section>

        <!-- Main Hub Feed View -->
        <div id="hubView" class="hide">
            <section class="mc-panel new-post-box">
                <h2>(e.g. I built a castle in minecraft/bloxd)</h2>
                <textarea id="postContent" placeholder="Write your message here..."></textarea>
                <button id="submitPostBtn" class="mc-btn">POST BLOCK</button>
            </section>
            <section id="feedContainer" class="feed-container"></section>
        </div>

        <!-- Public Player Profile View -->
        <div id="profileView" class="hide">
            <section class="mc-panel profile-box">
                <div class="profile-header-card">
                    <div id="profilePfp" class="avatar-big"></div>
                    <div>
                        <h2 id="profileUsername" style="margin:0;"></h2>
                        <p id="profileJoined" class="post-meta" style="margin:5px 0 0 0;">Active Redstone Network Player and user</p>
                    </div>
                </div>
                <button id="backToFeedBtn" class="mc-btn" style="margin-top:15px;">Back to Hub</button>
            </section>
            <h3 style="text-shadow: 2px 2px #000; margin-bottom:15px;">Creations by this player:</h3>
            <section id="profileFeedContainer" class="feed-container"></section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
